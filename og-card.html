<!doctype html>
<!-- og-image.png 원본. 1200x630으로 렌더링해 링크 미리보기 이미지로 쓴다. -->
<html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#fff;color:#111827;font-family:"Pretendard Variable",Pretendard,sans-serif;-webkit-font-smoothing:antialiased;word-break:keep-all}
.wrap{padding:64px 80px}
.mark{font-size:34px;font-weight:800;letter-spacing:-.03em}.mark span{color:#3b5bfd}
h1{margin:36px 0 0;font-size:88px;line-height:1.12;font-weight:800;letter-spacing:-.035em}
.tile{display:flex;align-items:center;gap:22px;margin-top:44px;width:max-content;padding:22px 30px 20px 24px;background:#e6f6ec;border:3px solid #0e8241;border-bottom-width:6px;border-radius:22px}
.key{display:grid;place-items:center;width:46px;height:46px;border-radius:13px;background:#0e8241}
.key svg{width:26px;height:26px;fill:none;stroke:#fff;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.txt{font-size:32px;font-weight:600;letter-spacing:-.01em}
.txt small{display:block;margin-top:4px;font-size:23px;font-weight:700;color:#0a5a2e}
.facts{position:absolute;right:80px;top:72px;font-size:24px;font-weight:600;color:#6b7280}
</style></head><body>
<div class="wrap">
  <div class="mark">말씀일까<span>?</span></div>
  <div class="facts">5문제 · 4지선다 · 개역개정</div>
  <h1>틀린 구절<br>하나를 찾아라</h1>
  <div class="tile"><span class="key"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span><span class="txt">하나님은 스스로 돕는 자를 도우시느니라<small>성경에 없는 문장</small></span></div>
</div>
</body></html>
